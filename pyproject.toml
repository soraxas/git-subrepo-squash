[project]
name = "git-subrepo-squash"
version = "0.1.0"
description = "Generate squash patches for git-subrepo vendor directories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gitpython>=3.1.45",
]

[project.scripts]
git-subrepo-squash = "git_subrepo_squash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_subrepo_squash"]
